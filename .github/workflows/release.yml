name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Test
        run: go test ./...
      - name: Verify
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Build macOS archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o /tmp/open-agent-clock-version ./cmd/open-agent-clock
          test "$(/tmp/open-agent-clock-version version)" = "$GITHUB_REF_NAME"
          for arch in arm64 amd64; do
            rm -rf package/*
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o package/open-agent-clock ./cmd/open-agent-clock
            cp README.md README.ru.md package/
            tar -C package -czf "dist/open-agent-clock_darwin_${arch}.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
